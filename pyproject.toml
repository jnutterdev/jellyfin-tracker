[project]
name = "jellyfin-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jnutterdev", email = "hello@jnutter.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-q2>=1.11.1",
    "djangorestframework>=3.18.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
jellyfin-tracker = "jellyfin_tracker:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.1",
]
prod = [
    "gunicorn>=26.2.0",
]
